# Startar bara databaserna. Applikationen kör vi lokalt med npm run dev.
# Portarna på värden (5433, 27017) matchar standardvärdena i api/src/config.js.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: utpost
      POSTGRES_PASSWORD: utpost
      POSTGRES_DB: utpost
    ports:
      - "5433:5432"
    volumes:
      - utpost_pgdata:/var/lib/postgresql/data
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: utpost
      MONGO_INITDB_ROOT_PASSWORD: utpost
    ports:
      - "27017:27017"
    volumes:
      - utpost_mongodata:/data/db
volumes:
  utpost_pgdata:
  utpost_mongodata:
